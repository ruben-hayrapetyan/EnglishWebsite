# Runs the rule checks, unit tests and browser tests on every pull request.
# The site itself has no build step; this only runs the development tools
# listed in requirements-dev.txt. See AGENTS.md "Tooling and tests".
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Rule checks and unit tests
        # Tools in tools/ must keep at least 85% branch coverage.
        run: |
          if git ls-files 'tools/*.py' 'tools/**/*.py' | grep -q .; then
            python -m pytest -m "not e2e" --cov --cov-fail-under=85
          else
            python -m pytest -m "not e2e"
          fi

      - name: Browser tests
        run: python -m pytest -m e2e
